trigger:
  batch: true
  branches:
    include:
      - legacy

variables:
  - name: ConvertNetCore
    value: false

resources:
  repositories:
    - repository: niveristand-custom-device-build-tools
      type: github
      ref: main
      endpoint: nivs-custom-devices
      name: ni/niveristand-custom-device-build-tools

stages:
  - template: azure-templates/stages-legacy.yml@niveristand-custom-device-build-tools
    parameters:
      lvVersionsToBuild:
        - version: '2025'
          bitness: '64bit'
        - version: '2026'
          bitness: '64bit'

      buildSteps:
        - projectLocation: 'Source\NI Synchronization Custom Device.lvproj'
          buildOperation: 'ExecuteBuildSpec'
          target: 'My Computer'
          buildSpec: 'Configuration Release'

        - projectLocation: 'Source\NI Synchronization Custom Device.lvproj'
          buildOperation: 'ExecuteBuildSpecAllTargets'
          target: 'All'
          buildSpec: 'Engine Release'

      releaseVersion: '27.0.0'
      buildOutputLocation: 'Built'
      archiveLocation: '\\nirvana\Measurements\VeriStandAddons\legacy\ni_synchronization_custom_device'
      repoName: 'niveristand-synchronization-custom-device'

      packages:
        - controlFileName: 'control'
          payloadMaps:
            - installLocation: 'documents\National Instruments\NI VeriStand $(lvVersion)\Timing and Sync\National Instruments'
